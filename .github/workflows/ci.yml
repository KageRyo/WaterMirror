name: CI

on:
  push:
    branches: [main]
    tags:
      - "WaterMirror-v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Run Expo Doctor
        run: npx expo-doctor

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo configuration
        run: npx expo config --json > /dev/null

      - name: Export web bundle (build validation)
        env:
          EXPO_PUBLIC_API_BASE_URL: https://wq-integration.example.invalid
          EXPO_PUBLIC_DEFAULT_MODEL: direct_wqi5
          EXPO_PUBLIC_REQUEST_TIMEOUT_MS: "10000"
        run: npx expo export --platform web --output-dir dist

      - name: Verify public backend configuration is bundled
        run: grep --recursive --fixed-strings 'https://wq-integration.example.invalid' dist/_expo/static/js

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: watermirror:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test Docker image
        run: docker run --rm watermirror:ci-test node --version
