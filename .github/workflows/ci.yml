name: CI

on:
  push:
    branches: [main]
    tags:
      - "WaterMirror-v*"
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.23.4, 24.22.1]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Lifecycle scripts stay disabled; only the reviewed toolchain patch runs.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node scripts/patch-toolchain.cjs --apply

      - name: Audit dependencies
        run: npm run audit:ci

      - name: Run tests
        run: npm test

      - name: Run Expo Doctor
        run: ./node_modules/.bin/expo-doctor

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: 'npm'

      # Lifecycle scripts stay disabled; only the reviewed toolchain patch runs.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          node scripts/patch-toolchain.cjs --apply

      - name: Verify Expo configuration
        run: ./node_modules/.bin/expo config --json > /dev/null

      - name: Export web bundle (build validation)
        env:
          EXPO_PUBLIC_API_BASE_URL: https://wq-integration.example.invalid
          EXPO_PUBLIC_DEFAULT_MODEL: direct_wqi5
          EXPO_PUBLIC_REQUEST_TIMEOUT_MS: "10000"
        run: ./node_modules/.bin/expo export --platform web --output-dir dist

      - name: Verify public backend configuration is bundled
        run: grep --recursive --fixed-strings 'https://wq-integration.example.invalid' dist/_expo/static/js

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: watermirror:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke test Docker image
        run: docker run --rm watermirror:ci-test node --version
